/* ---------- 顶栏 ---------- */
.ch-top{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:20px 0 40px;flex-wrap:wrap;
}
.ch-logo{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:19px;color:var(--wine);letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.ch-logo i{font-family:"IBM Plex Mono",monospace;font-style:normal;font-size:8px;letter-spacing:.14em;line-height:1.35;color:#8A7076;text-align:left}
.ch-top-mid{font-family:"Noto Serif SC",serif;font-weight:700;color:var(--rouge);font-size:15px}
.ch-top-r{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.ch-dot{width:7px;height:7px;border-radius:50%;background:var(--rouge)}

/* ---------- Hero 两栏 ---------- */
.ch-wrap{width:min(100% - 2.5rem,1180px);margin-inline:auto}
.ch-hero{display:grid;gap:44px;grid-template-columns:1fr;padding-bottom:56px}
@media(min-width:940px){.ch-hero{grid-template-columns:1fr 1.05fr;align-items:center;gap:56px}}
.ch-h1{
  font-family:"Noto Serif SC",Georgia,serif;font-weight:900;
  font-size:clamp(1.9rem,3.6vw,2.9rem);line-height:1.36;margin:0;
  text-wrap:balance;color:var(--ink);
}
.ch-h1 em{font-style:normal;color:var(--rouge)}
.ch-copy{margin-top:30px;display:flex;flex-direction:column;gap:14px;font-size:17px}
.ch-copy p{margin:0}
/* 关键：高亮是浅茶色底纹，不是变色 */
.mark{background:#F2E5CE;padding:.06em .3em;border-radius:3px;font-weight:700;color:var(--ink)}
.ch-copy .wine{color:var(--rouge);font-weight:700}

.ch-facts{margin-top:34px;display:flex;flex-direction:column;gap:11px;font-size:15.5px}
.ch-facts div{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.ch-facts b{font-weight:700}
.ch-facts .r{color:var(--rouge);font-weight:700}
.ch-facts .sep{color:#B3A29F}

/* ---------- 金框视频 ---------- */
.ch-frame{
  position:relative;padding:16px 22px;border-radius:14px;
  background:linear-gradient(150deg,#2A0B12 0%,#170608 60%,#210910 100%);
  box-shadow:0 30px 60px -34px rgba(46,12,23,.75), 0 0 0 1px rgba(184,150,62,.28);
  background-image:
    linear-gradient(#B8963E,#B8963E),linear-gradient(#B8963E,#B8963E),
    linear-gradient(#B8963E,#B8963E),linear-gradient(#B8963E,#B8963E),
    linear-gradient(#B8963E,#B8963E),linear-gradient(#B8963E,#B8963E),
    linear-gradient(#B8963E,#B8963E),linear-gradient(#B8963E,#B8963E),
    linear-gradient(150deg,#2A0B12 0%,#170608 60%,#210910 100%);
  background-repeat:no-repeat;
  background-size:38px 2px,2px 38px, 38px 2px,2px 38px, 38px 2px,2px 38px, 38px 2px,2px 38px, auto;
  background-position:
    8px 8px, 8px 8px,
    calc(100% - 8px) 8px, calc(100% - 8px) 8px,
    8px calc(100% - 8px), 8px calc(100% - 8px),
    calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) calc(100% - 8px),
    center;
}
.ch-frame::before{
  content:"A · I";position:absolute;left:7px;top:50%;transform:translateY(-50%) rotate(180deg);
  writing-mode:vertical-rl;font-family:"IBM Plex Mono",monospace;font-size:9px;
  letter-spacing:.28em;color:rgba(232,207,146,.75);
}
.ch-frame::after{
  content:"· S Y S  R E A D Y";position:absolute;right:16px;bottom:5px;
  font-family:"IBM Plex Mono",monospace;font-size:7.5px;letter-spacing:.2em;color:rgba(232,207,146,.45);
}
.ch-screen{
  position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 0%,#3A1020,#150406);
  border:1px solid rgba(184,150,62,.4);
  display:grid;place-content:center;gap:10px;text-align:center;padding:20px;
}
.ch-screen iframe,.ch-screen video{position:absolute;inset:0;width:100%;height:100%;border:0}
.ch-play{width:56px;height:56px;border-radius:50%;margin:0 auto;display:grid;place-items:center;
  background:linear-gradient(150deg,#F3E0AE,#D9B65F 38%,#B8963E);color:#3A1208;font-size:17px;
  box-shadow:0 8px 24px -6px rgba(184,150,62,.85)}
.ch-screen p{margin:0;color:#E8CF92;font-size:12px;font-family:"IBM Plex Mono",monospace;letter-spacing:.1em}

/* ---------- 金色 CTA ---------- */
.ch-cta-wrap{grid-column:1/-1;display:flex;justify-content:center;padding-top:8px}

/* ---------- 深色段 ---------- */
.ch-dark-inner{padding:74px 0 40px;text-align:center}
.ch-eyebrow{
  display:flex;align-items:center;justify-content:center;gap:14px;margin:0;
  font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.24em;color:#D9B65F;
}
.ch-eyebrow::before,.ch-eyebrow::after{content:"";height:1px;width:32px;background:currentColor;opacity:.75}
.ch-h2{
  font-family:"Noto Serif SC",Georgia,serif;font-weight:900;color:#FFF6E8;
  font-size:clamp(1.6rem,3.4vw,2.6rem);margin:22px 0 0;line-height:1.4;text-wrap:balance;
}
.ch-h2 em{font-style:normal;color:#E8CF92}
.ch-dark-sub{margin:20px 0 0;color:#D9C4C9;font-size:17px}
